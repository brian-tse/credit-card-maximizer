name: Checks
on:
  pull_request:
  workflow_call:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  quality:
    name: Tests and data validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npx wrangler deploy --dry-run --config workers/wrangler.jsonc
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: dist
          include-hidden-files: true
          retention-days: 14
